name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: livingspace-be-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, migrate, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livingspace_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d livingspace_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # CI-only credentials (not production). Never store real secrets here.
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livingspace_dev
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/livingspace_test
      CORS_ORIGINS: http://localhost:3000
      API_PREFIX: api/v1
      PORT: "4000"
      # Optional Auth pair left unset — e2e mocks the token verifier.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Create integration test database
        run: node scripts/ci-create-test-db.mjs

      - name: Apply migrations (development database)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livingspace_dev

      - name: Apply migrations (test database)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livingspace_test

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build
